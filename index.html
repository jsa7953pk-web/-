<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원라인 무비</title>

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.8;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 100px;
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
      border: none;
      resize: none;
    }

    button {
      margin-top: 20px;
      width: 100%;
      height: 52px;
      background: #16a34a;
      color: white;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .result {
      margin-top: 30px;
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎬 원라인 무비</h1>
    <p>한 줄로 영화를 상상해보세요</p>

    <textarea id="input" placeholder="예: 성을 지키는 장군"></textarea>
    <button onclick="makeMovie()">영화 만들어줘</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function makeMovie() {
      const text = document.getElementById("input").value;

      if (!text.trim()) {
        alert("한 줄을 입력해주세요!");
        return;
      }

      document.getElementById("result").innerText =
        "🎥 생성된 영화 컨셉:\n\n" + text;
    }
  </script>
</body>
</html>
