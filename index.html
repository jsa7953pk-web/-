<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>원라인 무비</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f0f0f;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      width: 90%;
      max-width: 420px;
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 1rem;
    }
    textarea {
      width: 100%;
      height: 120px;
      border-radius: 10px;
      border: none;
      padding: 12px;
      font-size: 1rem;
      resize: none;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      font-size: 1.1rem;
      border-radius: 10px;
      border: none;
      background: #00ff88;
      color: #000;
      font-weight: bold;
    }
    .result {
      margin-top: 20px;
      font-size: 0.95rem;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 원라인 무비</h1>
    <p>한 줄로 영화를 상상해보세요</p>
    <textarea id="prompt" placeholder="예: 비 오는 밤, 기억을 잃은 형사가 마지막 사건을 쫓는다"></textarea>
    <button onclick="generate()">영화 만들어줘</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    function generate() {
      const text = document.getElementById("prompt").value.trim();
      if (!text) {
        alert("내용을 입력해 주세요");
        return;
      }
      document.getElementById("result").innerText =
        "🎥 생성된 영화 콘셉트:\n\n" + text + "\n\n(다음 단계에서 AI 연결 예정)";
    }
  </script>
</body>
</html>
